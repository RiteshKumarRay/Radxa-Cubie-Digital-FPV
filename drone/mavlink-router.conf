# mavlink-router configuration for Radxa Cubie A7S Air Unit
# Bridges Flight Controller serial connection to WFB-ng UDP endpoints.

[General]
TcpServerPort=0
ReportStats=false
MavlinkDialect=common

[UartEndpoint FC]
# Replace Device with your Flight Controller USB/UART port (/dev/ttyACM0 or /dev/ttyUSB0)
Device=/dev/ttyACM0
Baud=115200

[UdpEndpoint ToWFB]
Mode=Normal
Address=127.0.0.1
Port=14561

[UdpEndpoint FromWFB]
Mode=Server
Address=0.0.0.0
Port=14560
